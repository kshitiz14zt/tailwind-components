<section class="bg-slate-900 min-h-screen">
    <div class="container mx-auto xl:w-[900px] xl:mt-16 pt-3 pl-3">
  
      <!-- Tabs -->
      <ul class="flex border-b border-[#1e2938] text-sm font-semibold text-[#9aa1af] flex-wrap">
        <li>
          <button onclick="showTab(1)" class="tab-btn flex items-center p-4 hover:text-[#2c7fff] border-b-2 hover:border-[#2c7fff]">
            <svg class="w-4 h-4 me-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Zm0 0a8.949 8.949 0 0 0 4.951-1.488A3.987 3.987 0 0 0 13 16h-2a3.987 3.987 0 0 0-3.951 3.512A8.948 8.948 0 0 0 12 21Zm3-11a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
            </svg>
            Profile
          </button>
        </li>
        <li>
          <button onclick="showTab(2)" class="tab-btn flex items-center p-4 hover:text-[#2c7fff] border-b-2 hover:border-[#2c7fff]">
            <svg class="w-4 h-4 me-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4h6v6H4V4zM14 4h6v6h-6V4zM4 14h6v6H4v-6zM14 14h6v6h-6v-6z"/>
            </svg>
            Dashboard
          </button>
        </li>
        <li>
          <button onclick="showTab(3)" class="tab-btn flex items-center p-4 hover:text-[#2c7fff] border-b-2 hover:border-[#2c7fff]">
            <svg class="w-4 h-4 me-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 4v10m0 0a2 2 0 1 0 0 4m0-4a2 2 0 1 1 0 4m0 0v2m6-16v2m0 0a2 2 0 1 0 0 4m0-4a2 2 0 1 1 0 4m0 0v10m6-16v10m0 0a2 2 0 1 0 0 4m0-4a2 2 0 1 1 0 4m0 0v2"/>
            </svg>
            Settings
          </button>
        </li>
        <li>
          <button onclick="showTab(4)" class="tab-btn flex items-center p-4 hover:text-[#2c7fff] border-b-2 hover:border-[#2c7fff]">
            <svg class="w-4 h-4 me-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14.079 6.839a3 3 0 0 0-4.255.1M13 20h1.083A3.916 3.916 0 0 0 18 16.083V9A6 6 0 1 0 6 9v7m7 4v-1a1 1 0 0 0-1-1h-1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1Zm-7-4v-6H5a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h1Zm12-6h1a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-1v-6Z"/>
            </svg>
            Contacts
          </button>
        </li>
        <li>
          <span class="inline-block p-4 cursor-not-allowed text-gray">Disabled</span>
        </li>
      </ul>
  
      <!-- Content -->
      <div class="text-white mt-6">
        <div id="tab1" class="block p-5">Profile content
          <p>This is the content of Profile tabs</p>
        </div>
        <div id="tab2" class="hidden p-5">Dashboard content
          <p>This is the content of Dashboard tabs</p>
        </div>
        <div id="tab3" class="hidden p-5">Settings content
          <p>This is the content of Settings tabs</p>
        </div>
        <div id="tab4" class="hidden p-5">Contacts content
          <p>This is the content of Contacts tabs</p>
        </div>
      </div>
  
    </div>
  </section>
  
  <script>
    function showTab(tabNumber) {
      const tabs = document.querySelectorAll(".tab-btn");
  
      tabs.forEach((tab, index) => {
        // Show selected content, hide others
        const content = document.getElementById("tab" + (index + 1));
        if (index + 1 === tabNumber) {
          content.classList.remove("hidden");
          tab.classList.add("text-[#2c7fff]", "border-[#2c7fff]");
          tab.classList.remove("border-transparent");
        } else {
          content.classList.add("hidden");
          tab.classList.remove("text-[#2c7fff]", "border-[#2c7fff]");
          tab.classList.add("border-transparent");
        }
      });
    }
  
    // Show first tab by default
    showTab(1);
  </script>
