  <div class="block h-6 w-14 rounded-full bg-[#e2e3e5] transition-colors peer-checked:bg-[#d7bc6d]"></div>

  <div class="dot absolute -top-[2px] left-0 h-7 w-7 rounded-full border-2 border-[#e3e4e6] bg-white transition-transform peer-checked:translate-x-7 peer-checked:border-2 peer-checked:border-[#95752b]"></div>
</label>
